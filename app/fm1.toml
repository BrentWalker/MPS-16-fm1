# The template's build settings (tools/build.py)
title = "MPS-16 ver FM1"           # the name people see (firmware.json)
name = "MPS-16"                  # APP_NAME is in app.h; this names the build's files (mps-16-X.Y.Z.fwsc)
id_prefix = "FM-1_83"          # package identity (each firmware its own): dev FM-1_1100, releases FM-1_11XXYYZZ
usb_manufacturer = "BeatSmith"
usb_product = "MPS-16 ver FM1"
o2 = []                        # separate units compiled at -O2 (an app's DSP)
words = "words.tsv"
ble = false
ble_central = false
msc = true                     # USB drive mode: MIDI files copied onto the FM-1
emu = ["data", "midi"]         # the browser emulator: its drive kept in the browser, Web MIDI ports
# the site (tools/make_site.py, tools/publish_site.sh)
tagline = "ver FM1, a MIDI phrase sampler for the M-VAVE FM-1"
repo = "https://github.com/BrentWalker/mps-16-fm1"
licence = "LicenseRef-MPS16-TBD"   # the app code's licence: to be chosen (fm1-base stays MPL-2.0)
credits = "Built on fm1-base by Charles Vestal and felucca-bsp by Leo Kuroshita."
# firmware.json, for firmware hubs (docs/FIRMWARE-JSON.md): the build writes it from these and the keys above
author = "Brent Walker (BeatSmith)"
description = "A MIDI phrase sampler in the Earth Science family. Load a MIDI file and it is on the 16 pads at once, sliced by bars, hits or chord changes; play the slices as recorded or as chords, strummed, arpeggiated or in rhythm, mutate repeated chords, and play bass, lead and key changes on the black keys. Early development."
tags = ["chords", "sampler", "midi"]
install = "https://brentwalker.github.io/mps-16-fm1/install/"
site = "https://brentwalker.github.io/mps-16-fm1/"
screenshot = "docs/img/screen-playing.png"
