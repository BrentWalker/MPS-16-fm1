# The template's build settings (tools/build.py)
name = "CHORDSMITH"              # APP_NAME is in app.h; this names the build's files
id_prefix = "FM-1_11"          # package identity (each firmware its own): dev FM-1_1100, releases FM-1_11XXYYZZ
usb_manufacturer = "BeatSmith"
usb_product = "ChordSmith FM"
o2 = []                        # separate units compiled at -O2 (an app's DSP)
words = "words.tsv"
ble = false
ble_central = false
# the site (tools/make_site.py, tools/publish_site.sh)
tagline = "chords and phrases on 16 pads"
repo = "https://github.com/BrentWalker/chordsmith-fm"
licence = "TBD"              # the app code's licence: to be chosen (fm1-base stays MPL-2.0)
credits = "Built on fm1-base by Charles Vestal and felucca-bsp by Leo Kuroshita."
# firmware.json, for firmware hubs (docs/FIRMWARE-JSON.md): the build writes it from these and the keys above
author = "Brent Walker (BeatSmith)"
description = "Chords and phrases on 16 pads. The white keys play the chords of any key and scale, the black keys play its scale degrees and light up with each chord's root. Early development."
tags = ["chords", "synth", "midi"]
install = "https://github.com/BrentWalker/chordsmith-fm"   # an install page comes later
site = "https://github.com/BrentWalker/chordsmith-fm"
screenshot = "docs/img/screen-playing.png"
