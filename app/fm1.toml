# The template's build settings (tools/build.py)
title = "SEED, MPS-16 ver FM1"           # the name people see (firmware.json)
name = "MPS-16"                  # this names the build's files (mps-16-X.Y.Z.fwsc); APP_NAME (app.h) is SEED
id_prefix = "FM-1_83"          # package identity (each firmware its own): dev FM-1_1100, releases FM-1_11XXYYZZ
usb_manufacturer = "BeatSmith"
usb_product = "MPS-16 ver FM1"
o2 = []                        # separate units compiled at -O2 (an app's DSP)
words = "words.tsv"
ble = true
ble_central = false
msc = false                    # no USB drive: SEED builds from your key, not from files
emu = ["midi"]                 # the browser emulator: Web MIDI ports
# the site (tools/make_site.py, tools/publish_site.sh)
tagline = "SEED, an MPS-16 function for the M-VAVE FM-1: chords and progressions from any notes you play"
repo = "https://github.com/BrentWalker/MPS-16-fm1"
licence = "LicenseRef-MPS16-TBD"   # the app code's licence: to be chosen (fm1-base stays MPL-2.0)
credits = "Built on fm1-base by Charles Vestal and felucca-bsp by Leo Kuroshita."
# firmware.json, for firmware hubs (docs/FIRMWARE-JSON.md): the build writes it from these and the keys above
author = "Brent Walker (BeatSmith)"
description = "SEED, the chord builder of MPS-16 in the Earth Science family. Play a few notes you like, pick a scale that fits, and the 16 white keys hold its chords and progressions; the black keys play the notes of the key and light up the bass of each chord; BASS, NO BASS, NO ROOT and TAP on the last four; edit (the whole group, or hold a key for one), lock, undo, record, save, and MIDI out over USB and Bluetooth with clock. COACH walks you through it with the keys and buttons it means lit. Early development."
tags = ["chords", "midi"]
install = "https://brentwalker.github.io/MPS-16-fm1/install/"
site = "https://brentwalker.github.io/MPS-16-fm1/"
screenshot = "app/docs/img/seed-home.png"
