# ChordSmith FM's site on GitHub Pages: the installer (Chrome or Edge on a computer, over USB), the browser emulator
# and the manual. Run by hand (Actions > Publish site > Run workflow). The firmware is built by the shared FM-1
# builder exactly as release.yml builds it; this then builds the emulator and the site around that package
# (base/tools/make_site.py, as base/tools/publish_site.sh does) and pushes it to the gh-pages branch.
name: Publish site

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown on the site (X.Y or X.Y-suffix)"
        default: "0.2"

permissions:
  contents: read

concurrency:
  group: chordsmith-site
  cancel-in-progress: false

jobs:
  firmware:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      sdk: true
      tests-block: true
      build: |
        set -euo pipefail
        git submodule update --init --recursive
        sudo apt-get install -y -qq libfribidi0
        python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow without raqm'"
        mkdir -p build/release-assets
        ./build.sh --release "${{ inputs.version }}"
        cp "app/build/chordsmith-${{ inputs.version }}.fwsc" build/release-assets/
        cp app/build/firmware.json build/release-assets/
      test: |
        set -euo pipefail
        [ -f "app/build/chordsmith-${{ inputs.version }}.fwsc" ]
        sh tests/run_tests.sh
      packages: build/release-assets/*

  site:
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: build/attested
      - name: Build the emulator and the site, push gh-pages
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq libfribidi0
          pip install -q Pillow fonttools
          git clone -q https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout -q a2b92777574c2feda07994cd4f1079a3dfc151f8   # emsdk 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10
          set +u; source "$RUNNER_TEMP/emsdk/emsdk_env.sh"; set -u
          pkg=$(find build/attested -name 'chordsmith*.fwsc' | head -1)
          test -n "$pkg"
          ./build.sh --web --release "$VERSION"
          python3 base/tools/make_site.py app "$pkg" "$VERSION" app/build/site
          cd app/build/site
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Site for ChordSmith FM $VERSION (from ${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "pushed the site to gh-pages"
